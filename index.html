<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>متجر السيكل</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <h1>🚲 متجر السيكل</h1>
    <p>مشروع جامعي – متجر دراجات هوائية</p>
</header>

<section class="products">

    <div class="product">
        <img src="images/bike1.jpg" alt="سيكل رياضي">
        <h3>سيكل رياضي</h3>
        <p class="price">150$</p>
        <button onclick="addToCart()">إضافة للسلة</button>
    </div>

    <div class="product">
        <img src="images/bike2.jpg" alt="سيكل جبلي">
        <h3>سيكل جبلي</h3>
        <p class="price">220$</p>
        <button onclick="addToCart()">إضافة للسلة</button>
    </div>

    <div class="product">
        <img src="images/bike3.jpg" alt="سيكل أطفال">
        <h3>سيكل أطفال</h3>
        <p class="price">100$</p>
        <button onclick="addToCart()">إضافة للسلة</button>
    </div>

</section>

<footer>
    <p>© 2026 مشروع جامعي</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
